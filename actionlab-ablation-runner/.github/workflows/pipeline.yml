name: pipeline
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -e .[dev]
      - name: Setup Typst
        uses: typst-community/setup-typst@v3
      - name: Research web
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/research_web.py
      - name: Run experiment pipeline
        run: python scripts/run_pipeline.py --config config.yaml
      - name: Synthesize narrative
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/synthesize.py
      - name: Build paper
        run: bash scripts/build_paper.sh
      - name: Build report
        run: bash scripts/build_report.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            artifacts/
            paper/paper.pdf
            site/
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy-pages:
    needs: run-pipeline
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
